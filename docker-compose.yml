services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: '8.5'
        WWWUSER: '${WWWUSER:-1000}'
        WWWGROUP: '${WWWGROUP:-1000}'
    image: notification-assessment:latest
    ports:
      - '${APP_PORT:-8000}:80'
    environment:
      CONTAINER_MODE: http
      WITH_SCHEDULER: 'false'
      WITH_HORIZON: 'false'
      RUNNING_MIGRATIONS_AND_SEEDERS: '${RUNNING_MIGRATIONS_AND_SEEDERS:-false}'
      DB_HOST: 'mysql'
      REDIS_HOST: 'redis'
    env_file:
      - .env
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./public:/var/www/html/public
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./tests:/var/www/html/tests
      - storage:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet

  worker-high:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: '8.5'
    image: notification-assessment:latest
    environment:
      DB_HOST: 'mysql'
      REDIS_HOST: 'redis'
      CONTAINER_MODE: worker
      WORKER_COMMAND: 'php /var/www/html/artisan queue:work redis --queue=notifications-high --sleep=3 --tries=5 --max-time=3600'
    env_file:
      - .env
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./public:/var/www/html/public
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./tests:/var/www/html/tests
      - storage:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet

  worker-normal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: '8.5'
    image: notification-assessment:latest
    environment:
      DB_HOST: 'mysql'
      REDIS_HOST: 'redis'
      CONTAINER_MODE: worker
      WORKER_COMMAND: 'php /var/www/html/artisan queue:work redis --queue=notifications-normal --sleep=3 --tries=5 --max-time=3600'
    env_file:
      - .env
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./public:/var/www/html/public
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./tests:/var/www/html/tests
      - storage:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet

  worker-low:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: '8.5'
    image: notification-assessment:latest
    environment:
      DB_HOST: 'mysql'
      REDIS_HOST: 'redis'
      CONTAINER_MODE: worker
      WORKER_COMMAND: 'php /var/www/html/artisan queue:work redis --queue=notifications-low --sleep=3 --tries=5 --max-time=3600'
    env_file:
      - .env
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./public:/var/www/html/public
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./tests:/var/www/html/tests
      - storage:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: '8.5'
    image: notification-assessment:latest
    environment:
      DB_HOST: 'mysql'
      REDIS_HOST: 'redis'
      CONTAINER_MODE: scheduler
      WITH_SCHEDULER: 'true'
    env_file:
      - .env
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./public:/var/www/html/public
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./tests:/var/www/html/tests
      - storage:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet

  mysql:
    image: mysql:8.0
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
      MYSQL_DATABASE: '${DB_DATABASE:-notification_assessment}'
      MYSQL_USER: '${DB_USERNAME:-notification_user}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - appnet
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - redis:/data
    networks:
      - appnet
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${FORWARD_MAIL_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  mysql:
    driver: local
  redis:
    driver: local
  storage:
    driver: local
